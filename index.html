<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modelos 3D</title>

    <!-- Librería Model Viewer -->
    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>
        body {
            margin: 0;
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-top: 30px;
        }

        .modelo-seccion {
            width: 90%;
            max-width: 1000px;
            margin-bottom: 50px;
            text-align: center;
        }
 
        .modelo-seccion h2 {
            margin-bottom: 10px;
        }

        model-viewer {
            width: 90%;
            height: 70vh;
            max-width: 1000px;
            background-color: white;
        }
    </style>
</head>

<body>

    <h1>Modelos 3D</h1>

    <!-- Modelo 1 -->
    <div class="modelo-seccion">
        <h2>Equipo SG1</h2>
        <model-viewer
            src="SG1.glb"
            ios-src="SG1.usdz"
            alt="SG1 modelo 3D"
            camera-controls
            auto-rotate
            ar
            ar-modes="webxr scene-viewer quick-look">
        </model-viewer>
    </div>

    <!-- Modelo 2 -->
    <div class="modelo-seccion">
        <h2>Equipo LS-1100</h2>
        <model-viewer
            src="LS-1100.glb"
            ios-src="LS-1100.usdz"
            alt="Modelo 2"
            camera-controls
            auto-rotate
            ar
            ar-modes="webxr scene-viewer quick-look">
        </model-viewer>
    </div>

    <!-- Modelo 3 -->
    <div class="modelo-seccion">
        <h2>Equipo MF-T1000</h2>
        <model-viewer
            src="MF-T1000.glb"
            ios-src="MF-T1000.usdz"
            alt="Modelo 3"
            camera-controls
            auto-rotate
            ar
            ar-modes="webxr scene-viewer quick-look">
        </model-viewer>
    </div>

</body>
</html>
