<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi modelo 3D</title>

    <!-- Librería Model Viewer -->
    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>
        body {
            margin: 0;
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-top: 30px;
        }

        model-viewer {
            width: 90%;
            height: 70vh;
            max-width: 1000px;
            background-color: white;
        }
    </style>
</head>

<body>

    <h1>Mi equipo 3D</h1>

    <model-viewer
        src="SG1.glb"
        ios-src="SG1.usdz"
        alt="Modelo 3D de mi equipo"
        camera-controls
        auto-rotate
        ar
        ar-modes="webxr scene-viewer quick-look">
    </model-viewer>

</body>
</html>
